allowBuilds:
  sharp: false
  unrs-resolver: false
  # next-intl's message extractor (unused): prebuilt binaries are enough.
  '@parcel/watcher': false
  '@swc/core': false
  # posthog-js's polyfills: the postinstall only prints a message.
  core-js: false
  # Firebase: @firebase/util's postinstall only acts when
  # FIREBASE_WEBAPP_CONFIG is set (Firebase App Hosting's auto-init); the
  # web passes its config explicitly. protobufjs's only prints a warning.
  '@firebase/util': false
  protobufjs: false
