# Known vulnerabilities in the dependency tree, every Monday (AGENTS.md §11).
name: Dependency audit

on:
  schedule:
    # Mondays 12:00 UTC (08:00 in Caracas).
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high
