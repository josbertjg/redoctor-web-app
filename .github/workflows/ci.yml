# Every pull request and every push to master must pass `pnpm check`
# (typecheck, lint, format, unit tests and the production build).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build validates every variable (app/lib/env.ts): CI builds with
      # the public values the unit tests use.
      - run: cp .env.test .env.local
      - run: pnpm check
